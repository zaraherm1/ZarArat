# managed-by: zara-setup v1.0
model:
  provider: openai-api
  default: deepseek-ai/DeepSeek-V4.1-Flash
  persist_switch_by_default: true

platforms:
  telegram:
    extra:
      allow_admin_from:
        - "{{OWNER_ID}}"
      user_allowed_commands: []
      command_menu:
        max_commands: 1
      # گروه‌ها باز — زارا تو گروه فعال می‌شه
      group_policy: open
      # تو گروه فقط وقتی جواب می‌ده که @منشن شده، ریپلای شده، یا اسمش «زارا» اومده
      require_mention: true
      mention_patterns:
        - "زارا"
        - "zara"
      # چت‌های بی‌منشن گروه رو می‌خونه که بافت مکالمه رو داشته باشه، ولی جواب نمی‌ده
      observe_unmentioned_group_messages: true
      bots_require_mention: true

tool_loop_guardrails:
  warnings_enabled: true
  non_interactive_hard_stop_enabled: false

display:
  show_reasoning: false
  interim_assistant_messages: true
  busy_ack_detail: false
